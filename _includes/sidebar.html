<aside class="side">
  <div class="side-inner">
    <div class="side-top">
      <a class="side-id" href="{{ '/' | relative_url }}">
        <img class="avatar" src="{{ '/assets/avatar.webp' | relative_url }}" width="96" height="96" alt="">
        <span class="handle">{{ site.title }}</span>
      </a>
      <button class="icon-btn" type="button" id="theme-toggle" aria-label="Switch colour theme">
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>

    <div class="side-more">
      <p class="side-role">Software engineer · Toronto</p>
      <p class="side-bio">I build backend services, Rust developer tools and games, and write down what I learn on the way.</p>
      <dl class="side-now">
        <div><dt>Now</dt><dd>Building <a href="https://github.com/ForgeAILab/forge">Forge</a> and <a href="https://github.com/ForgeAILab/smith">Smith</a></dd></div>
        <div><dt>Open to</dt><dd>Remote roles</dd></div>
      </dl>
      <nav class="side-nav" aria-label="Site">
        {% include nav.html %}
      </nav>
      <div class="side-foot">
        <ul class="social">
          <li><a href="{{ site.links.github }}" aria-label="GitHub"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/><path d="M9 18c-4.51 2-5-2-7-2"/></svg></a></li>
          <li><a href="{{ site.links.linkedin }}" aria-label="LinkedIn"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-4 0v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg></a></li>
          <li><a href="mailto:i@mai1015.com" aria-label="Email"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></a></li>
          <li><a href="{{ '/atom.xml' | relative_url }}" aria-label="RSS feed"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg></a></li>
        </ul>
        <p class="side-copy">© {{ site.time | date: '%Y' }} {{ site.author.name }}</p>
      </div>
    </div>
  </div>
</aside>
