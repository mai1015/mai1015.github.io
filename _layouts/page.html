---
layout: default
---
<article class="page">
  <header class="page-head">
    <h1 class="title">{{ page.title }}</h1>
    {%- if page.lead %}
    <p class="lead">{{ page.lead }}</p>
    {%- endif %}
  </header>
  <div class="prose{% if page.wide %} prose--wide{% endif %}">
    {{ content }}
  </div>
</article>
